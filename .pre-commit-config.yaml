ci:
  autofix_commit_msg: "fix: auto-fix by pre-commit.ci"
  autofix_prs: true
  autoupdate_schedule: weekly
  skip: []
  submodules: false

repos:
  - repo: local
    hooks:
      - id: vp-check
        name: vp check (format + lint + typecheck)
        entry: npx vp check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: unit-tests
        name: unit tests
        entry: npm test
        language: system
        pass_filenames: false
        stages: [pre-commit]
