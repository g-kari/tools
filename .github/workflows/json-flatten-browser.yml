name: JSON Flatten collision browser regression

on:
  pull_request:
    paths:
      - "app/routes/json-flatten.tsx"
      - "app/utils/json-flatten.ts"
      - "app/components/**"
      - "app/hooks/**"
      - "app/styles/base.css"
      - "app/styles/animations.css"
      - "app/styles/components.css"
      - "app/styles/tools/json-flatten.css"
      - "tests/browser/json-flatten/**"
      - "tests/unit/json-flatten*.test.ts"
      - "tests/e2e/json-flatten*.spec.ts"
      - "package*.json"
      - ".github/workflows/json-flatten-browser.yml"
  push:
    branches: [main]
    paths:
      - "app/routes/json-flatten.tsx"
      - "app/utils/json-flatten.ts"
      - "app/components/**"
      - "app/hooks/**"
      - "app/styles/base.css"
      - "app/styles/animations.css"
      - "app/styles/components.css"
      - "app/styles/tools/json-flatten.css"
      - "tests/browser/json-flatten/**"
      - "tests/unit/json-flatten*.test.ts"
      - "tests/e2e/json-flatten*.spec.ts"
      - "package*.json"
      - ".github/workflows/json-flatten-browser.yml"

permissions:
  contents: read

concurrency:
  group: json-flatten-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - run: npm ci --ignore-scripts
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Allow bubblewrap user namespaces under the Ubuntu 24.04 AppArmor restriction
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends apparmor-profiles
          profile=/etc/apparmor.d/bwrap-userns-restrict
          if [ ! -f "$profile" ]; then
            sudo cp /usr/share/apparmor/extra-profiles/bwrap-userns-restrict "$profile"
          fi
          sudo apparmor_parser -r "$profile"
      - name: Isolated production build, related unit tests, types and Chromium
        run: |
          test -s tests/browser/json-flatten/run-isolated.sh
          test -s tests/browser/json-flatten/inside-isolated.sh
          bash -n tests/browser/json-flatten/run-isolated.sh
          bash -n tests/browser/json-flatten/inside-isolated.sh
          bash tests/browser/json-flatten/run-isolated.sh
      - run: |
          mkdir -p test-results
          git rev-parse HEAD | tee test-results/json-flatten-source-sha.txt
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: json-flatten-browser-results
          path: test-results/json-flatten-source-sha.txt
          retention-days: 1
