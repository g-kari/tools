name: JSON Lines browser regression

on:
  pull_request:
    paths:
      - "app/routes/json-lines.tsx"
      - "app/utils/json-lines.ts"
      - "app/components/**"
      - "app/hooks/**"
      - "tests/browser/**"
      - "package*.json"
      - ".github/workflows/json-lines-browser.yml"
  push:
    branches: [main]
    paths:
      - "app/routes/json-lines.tsx"
      - "app/utils/json-lines.ts"
      - "app/components/**"
      - "app/hooks/**"
      - "tests/browser/**"
      - "package*.json"
      - ".github/workflows/json-lines-browser.yml"

permissions:
  contents: read

concurrency:
  group: json-lines-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vite build --config tests/browser/vite.config.ts
      - run: npx playwright test --config tests/browser/playwright.config.ts
        env:
          CI: true
      - run: |
          mkdir -p test-results
          git rev-parse HEAD | tee test-results/json-lines-source-sha.txt
        if: always()
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: json-lines-browser-results
          path: test-results/
          retention-days: 1
