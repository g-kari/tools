name: CSV JSON column preservation

on:
  pull_request:
    paths:
      - "app/routes/csv-json.tsx"
      - "app/routes/csv-sql.tsx"
      - "app/utils/csv-sql.ts"
      - "app/routes/url-encode.tsx"
      - "app/routes/url-parser.tsx"
      - "app/utils/url-parser.ts"
      - "app/routes/base64.tsx"
      - "app/routes/yaml-json.tsx"
      - "app/routes/xml-json.tsx"
      - "app/utils/xml-json.ts"
      - "app/components/**"
      - "app/hooks/**"
      - "app/styles/base.css"
      - "app/styles/animations.css"
      - "app/styles/components.css"
      - "app/styles/tools/csv-json.css"
      - "app/styles/tools/csv-sql.css"
      - "app/styles/tools/url-parser.css"
      - "app/styles/tools/number-base.css"
      - "tests/browser/csv-json/**"
      - "tests/unit/csv-json*.test.ts"
      - "tests/unit/csv-sql*.test.ts"
      - "tests/e2e/csv-sql*.spec.ts"
      - "tests/e2e/csv-json.spec.ts"
      - "tests/unit/url-encode*.test.ts"
      - "tests/e2e/url-encode.spec.ts"
      - "tests/e2e/url-parser.spec.ts"
      - "tests/unit/url-parser.test.ts"
      - "tests/e2e/base64-input-recovery.spec.ts"
      - "tests/unit/base64-input-recovery.test.ts"
      - "tests/unit/yaml-json*.test.ts"
      - "tests/e2e/yaml-json.spec.ts"
      - "tests/unit/xml-json*.test.ts"
      - "tests/e2e/xml-json.spec.ts"
      - "package*.json"
      - ".github/workflows/csv-json-browser.yml"
  push:
    branches: [main]
    paths:
      - "app/routes/csv-json.tsx"
      - "app/routes/csv-sql.tsx"
      - "app/utils/csv-sql.ts"
      - "app/routes/url-encode.tsx"
      - "app/routes/url-parser.tsx"
      - "app/utils/url-parser.ts"
      - "app/routes/base64.tsx"
      - "app/routes/yaml-json.tsx"
      - "app/routes/xml-json.tsx"
      - "app/utils/xml-json.ts"
      - "app/components/**"
      - "app/hooks/**"
      - "app/styles/base.css"
      - "app/styles/animations.css"
      - "app/styles/components.css"
      - "app/styles/tools/csv-json.css"
      - "app/styles/tools/csv-sql.css"
      - "app/styles/tools/url-parser.css"
      - "app/styles/tools/number-base.css"
      - "tests/browser/csv-json/**"
      - "tests/unit/csv-json*.test.ts"
      - "tests/unit/csv-sql*.test.ts"
      - "tests/e2e/csv-sql*.spec.ts"
      - "tests/e2e/csv-json.spec.ts"
      - "tests/unit/url-encode*.test.ts"
      - "tests/e2e/url-encode.spec.ts"
      - "tests/e2e/url-parser.spec.ts"
      - "tests/unit/url-parser.test.ts"
      - "tests/e2e/base64-input-recovery.spec.ts"
      - "tests/unit/base64-input-recovery.test.ts"
      - "tests/unit/yaml-json*.test.ts"
      - "tests/e2e/yaml-json.spec.ts"
      - "tests/unit/xml-json*.test.ts"
      - "tests/e2e/xml-json.spec.ts"
      - "package*.json"
      - ".github/workflows/csv-json-browser.yml"

permissions:
  contents: read

concurrency:
  group: csv-json-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx vp check
      - run: npx vp test run
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - run: npx vp build --config tests/browser/csv-json/vite.config.ts
      - run: npx playwright test --config tests/browser/csv-json/playwright.config.ts
        env:
          CI: true
      - run: npx playwright test --config tests/browser/csv-json/url-app.config.ts
        env:
          CI: true
          WRANGLER_SEND_METRICS: "false"
      - run: npx playwright test --config tests/browser/csv-json/url-parser-app.config.ts
        env:
          CI: true
          WRANGLER_SEND_METRICS: "false"
      - run: npx playwright test --config tests/browser/csv-json/base64-app.config.ts
        env:
          CI: true
          WRANGLER_SEND_METRICS: "false"
      - run: npx playwright test --config tests/browser/csv-json/csv-sql-app.config.ts
        env:
          CI: true
          WRANGLER_SEND_METRICS: "false"
      - run: npx playwright test --config tests/browser/csv-json/xml-json-app.config.ts
        env:
          CI: true
          WRANGLER_SEND_METRICS: "false"
      - run: npx playwright test --config tests/browser/csv-json/yaml-json-app.config.ts
        env:
          CI: true
          WRANGLER_SEND_METRICS: "false"
      - run: |
          mkdir -p test-results
          git rev-parse HEAD | tee test-results/json-source-sha.txt
        if: always()
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: csv-json-browser-results
          path: test-results/
          retention-days: 1
