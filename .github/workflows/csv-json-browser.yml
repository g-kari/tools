      - "app/utils/curl-to-fetch.ts"
      - "tests/unit/curl-to-fetch*.test.ts"
      - "tests/e2e/curl-to-fetch*.spec.ts"
      - "app/routes/ini-parser.tsx"
      - "app/utils/ini-parser.ts"
