      - "tests/unit/text-replace.test.ts"
      - "tests/unit/base64-input-recovery.test.ts"
      - "tests/unit/yaml-json*.test.ts"
      - "tests/e2e/yaml-json.spec.ts"
      - "tests/unit/xml-json*.test.ts"
      - "tests/e2e/xml-json.spec.ts"
      - "tests/unit/json-to-ts.test.ts"
      - "tests/e2e/json-to-ts.spec.ts"
      - "package*.json"
      - ".github/workflows/csv-json-browser.yml"

permissions:
  contents: read

concurrency:
  group: csv-json-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser_shard:
    name: browser (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [core, generators]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx vp check
      - run: npx vp test run
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - run: npx vp build --config tests/browser/csv-json/vite.config.ts
      - if: matrix.suite == 'core'
        run: npx playwright test --config tests/browser/csv-json/playwright.config.ts
        env:
          CI: true
      - if: matrix.suite == 'core'
        run: npx playwright test --config tests/browser/csv-json/url-app.config.ts
        env:
          CI: true
          WRANGLER_SEND_METRICS: "false"
      - if: matrix.suite == 'core'
        run: npx playwright test --config tests/browser/csv-json/url-parser-app.config.ts
        env:
          CI: true
          WRANGLER_SEND_METRICS: "false"
      - if: matrix.suite == 'core'
        run: npx playwright test --config tests/browser/csv-json/base64-app.config.ts
        env:
          CI: true
          WRANGLER_SEND_METRICS: "false"
      - if: matrix.suite == 'core'
        run: npx playwright test --config tests/browser/csv-json/ini-app.config.ts
        env:
          CI: true
          WRANGLER_SEND_METRICS: "false"
      - if: matrix.suite == 'core'
        run: npx playwright test --config tests/browser/csv-json/csv-sql-app.config.ts
        env:
          CI: true
          WRANGLER_SEND_METRICS: "false"
      - if: matrix.suite == 'generators'
        run: npx playwright test --config tests/browser/csv-json/xml-json-app.config.ts
        env:
          CI: true
          WRANGLER_SEND_METRICS: "false"
      - if: matrix.suite == 'generators'
        run: npx playwright test --config tests/browser/csv-json/yaml-json-app.config.ts
        env:
          CI: true
          WRANGLER_SEND_METRICS: "false"
      - if: matrix.suite == 'generators'
        run: npx playwright test --config tests/browser/csv-json/json-to-ts-app.config.ts
        env:
          CI: true
          WRANGLER_SEND_METRICS: "false"
      - if: matrix.suite == 'generators'
        run: npx playwright test --config tests/browser/csv-json/json-to-graphql-app.config.ts
        env:
          CI: true
          WRANGLER_SEND_METRICS: "false"
      - if: matrix.suite == 'generators'
        run: npx playwright test --config tests/browser/csv-json/text-replace-app.config.ts
        env:
          CI: true
          WRANGLER_SEND_METRICS: "false"
      - if: matrix.suite == 'generators'
        run: npx playwright test --config tests/browser/csv-json/curl-to-fetch-app.config.ts
        env:
          CI: true
          WRANGLER_SEND_METRICS: "false"
      - if: matrix.suite == 'generators'
        run: npx playwright test --config tests/browser/csv-json/env-parser-app.config.ts
        env:
          CI: true
          WRANGLER_SEND_METRICS: "false"
      - run: |
          mkdir -p test-results
          git rev-parse HEAD | tee test-results/json-source-sha.txt
        if: always()
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: csv-json-browser-results-${{ matrix.suite }}
          path: test-results/
          retention-days: 1

  browser:
    if: ${{ always() }}
    needs: browser_shard
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every browser shard
        env:
          SHARD_RESULT: ${{ needs.browser_shard.result }}
        run: test "$SHARD_RESULT" = success
