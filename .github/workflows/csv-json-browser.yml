      - "app/utils/json-to-graphql.ts"
      - "tests/unit/json-to-graphql.test.ts"
      - "tests/e2e/json-to-graphql.spec.ts"
      - "app/routes/curl-to-fetch.tsx"
      - "app/utils/curl-to-fetch.ts"
      - "tests/unit/curl-to-fetch*.test.ts"
      - "tests/e2e/curl-to-fetch*.spec.ts"
      - "app/routes/ini-parser.tsx"
      - "app/utils/ini-parser.ts"
      - "tests/unit/ini*.test.ts"
      - "tests/e2e/ini-parser.spec.ts"
      - "app/routes/csv-json.tsx"
      - "app/routes/csv-sql.tsx"
      - "app/utils/csv-sql.ts"
      - "app/routes/url-encode.tsx"
      - "app/routes/url-parser.tsx"
      - "app/utils/url-parser.ts"
      - "app/routes/base64.tsx"
      - "app/routes/text-replace.tsx"
      - "app/utils/text-replace.ts"
      - "app/routes/yaml-json.tsx"
      - "app/routes/xml-json.tsx"
      - "app/utils/xml-json.ts"
      - "app/routes/json-to-ts.tsx"
      - "app/utils/json-to-ts.ts"
      - "app/routes/env-parser.tsx"
      - "app/utils/env-parser.ts"
