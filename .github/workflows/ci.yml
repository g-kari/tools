name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Format & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      - name: Check (format + lint + typecheck)
        run: npx vp check
        env:
          CI: true

      - name: Show INI route formatting diff after validation failure
        if: failure()
        timeout-minutes: 1
        run: |
          file=app/routes/ini-parser.tsx
          node node_modules/oxfmt/bin/oxfmt --stdin-filepath "$file" < "$file" > "$RUNNER_TEMP/ini-route-formatted.tsx"
          diff -u "$file" "$RUNNER_TEMP/ini-route-formatted.tsx" || test "$?" -eq 1

      - name: Unit tests
        run: npm test
        env:
          CI: true
