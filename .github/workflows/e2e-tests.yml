name: E2E Tests (GitHub-hosted)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build job - runs on GitHub-hosted runner
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      - name: Build application
        run: npm run build
        env:
          CI: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-output
          path: |
            dist/
            .wrangler/
            wrangler.jsonc
          include-hidden-files: true
          retention-days: 1

      - name: Get E2E test files
        id: set-matrix
        run: |
          # Get list of E2E test files and create matrix
          FILES=$(find tests/e2e -name "*.spec.ts" -type f | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix={\"test-file\":$FILES}" >> $GITHUB_OUTPUT
          echo "Found test files: $FILES"

  # Keep all E2E validation in the cloud, including internal PRs and main pushes.
  e2e:
    needs: build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-output

      - name: Debug artifact structure
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Directory contents ==="
          ls -la
          echo "=== dist contents ==="
          ls -la dist/ || echo "dist not found"
          echo "=== .wrangler contents ==="
          ls -la .wrangler/ || echo ".wrangler not found"
          ls -la .wrangler/deploy/ || echo ".wrangler/deploy not found"

      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E test
        run: |
          npm run preview -- --port 8788 --host &
          SERVER_PID=$!
          npx wait-on http://127.0.0.1:8788 --timeout 60000
          BASE_URL=http://127.0.0.1:8788 npx playwright test ${{ matrix.test-file }} --project=chromium --reporter=list
          TEST_EXIT_CODE=$?
          kill $SERVER_PID || true
          exit $TEST_EXIT_CODE
        env:
          CI: true

  # Summary job - aggregates results
  summary:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Post test result to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const e2eResult = '${{ needs.e2e.result }}';
            const success = e2eResult === 'success';
            const emoji = success ? '✅' : '❌';
            const status = success ? 'passed' : 'failed';

            let body = `## ${emoji} E2E Tests ${status}\n\n`;

            const runnerType = 'GitHub-hosted runners';

            if (success) {
              body += `All E2E tests passed successfully.\n\n`;
            } else {
              body += `Some E2E tests failed. Check the [workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.\n\n`;
            }

            body += `### Test Matrix Results\n\n`;
            body += `| Status | Result |\n`;
            body += `|--------|--------|\n`;
            body += `| Build | ${{ needs.build.result == 'success' && '✅' || '❌' }} |\n`;
            body += `| E2E Tests | ${emoji} |\n`;
            body += `| Runner | ${runnerType} |\n`;

            body += `\n---\n`;
            body += `*Generated on ${new Date().toISOString()} (${runnerType})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('E2E Tests')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
